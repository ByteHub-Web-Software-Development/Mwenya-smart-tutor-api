name: SmartTutor API CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_KEY: test-key

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_KEY: test-key
          PORT: 5180
