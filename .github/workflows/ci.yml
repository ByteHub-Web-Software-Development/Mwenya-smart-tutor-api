name: SmartTutor API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: mongodb://localhost:27017/smarttutor_test?directConnection=true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: mongodb://localhost:27017/smarttutor_test?directConnection=true
          GEMINI_API_KEY: test-key

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          JWT_SECRET: test-secret-for-ci
          DATABASE_URL: mongodb://localhost:27017/smarttutor_test?directConnection=true
          GEMINI_API_KEY: test-key
          PORT: 5180
